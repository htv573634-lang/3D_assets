name: Setup Folder Structure

on:
  workflow_dispatch: # This allows you to run it manually

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push changes back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Git LFS
        run: |
          git lfs install

      - name: Create Folders and Files
        run: |
          mkdir -p Models Workflows Output
          touch Models/.gitkeep Workflows/.gitkeep Output/.gitkeep
          
          # Create .gitattributes for Git LFS
          cat > .gitattributes << 'EOF'
          *.blend filter=lfs diff=lfs merge=lfs -text
          *.blend1 filter=lfs diff=lfs merge=lfs -text
          *.glb filter=lfs diff=lfs merge=lfs -text
          *.gltf filter=lfs diff=lfs merge=lfs -text
          *.obj filter=lfs diff=lfs merge=lfs -text
          *.mtl filter=lfs diff=lfs merge=lfs -text
          *.fbx filter=lfs diff=lfs merge=lfs -text
          *.png filter=lfs diff=lfs merge=lfs -text
          *.jpg filter=lfs diff=lfs merge=lfs -text
          *.jpeg filter=lfs diff=lfs merge=lfs -text
          *.tga filter=lfs diff=lfs merge=lfs -text
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Auto-setup: Created folders and Git LFS configuration" || echo "No changes to commit"
          git push
