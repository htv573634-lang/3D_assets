name: Inspect Blend File

on:
  workflow_dispatch: 

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Blender 2.79b (Ancient Support)
        run: |
          wget -q https://download.blender.org/release/Blender2.79/blender-2.79b-linux-glibc219-x86_64.tar.bz2
          tar -xf blender-2.79b-linux-glibc219-x86_64.tar.bz2
          mv blender-2.79b-linux-glibc219-x86_64 blender_legacy

      - name: Run Inspection Script
        run: |
          for file in Models/*.blend; do
            if [ -f "$file" ]; then
              echo "=================================================="
              echo "Inspecting: $file"
              echo "=================================================="
              ./blender_legacy/blender -b "$file" -P Workflows/inspect.py
            fi
          done
