name: Extract Olympias Assets

on:
  workflow_dispatch: 

jobs:
  extract_olympias:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Legacy Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1

      - name: Download Blender 2.79b (Legacy)
        run: |
          wget -q https://download.blender.org/release/Blender2.79/blender-2.79b-linux-glibc219-x86_64.tar.bz2
          tar -xf blender-2.79b-linux-glibc219-x86_64.tar.bz2
          mv blender-2.79b-linux-glibc219-x86_64 blender_legacy

      - name: Run Upgrade Script (Blender 2.79b)
        run: |
          if [ -f "Models/QueenOlympias_v1.blend" ]; then
            echo "Processing Queen Olympias..."
            ./blender_legacy/blender -b "Models/QueenOlympias_v1.blend" -P Workflows/upgrade_olympias.py
          else
            echo "File Models/QueenOlympias_v1.blend not found!"
            exit 1
          fi

      - name: Clean up Blender binaries
        run: |
          rm -rf blender_legacy
          rm -f blender-*.tar.bz2

      - name: Install Modern Blender and Numpy
        run: |
          sudo apt-get install -y blender python3-numpy

      - name: Run Conversion Script (Blender 4.0)
        run: |
          if [ -f "Output/QueenOlympias_v1.obj" ]; then
            echo "Converting Olympias OBJ to GLB..."
            blender -b -P Workflows/convert_olympias.py -- "Output/QueenOlympias_v1.obj" "Output/QueenOlympias_v1.glb"
          fi

      - name: Commit and Push Output
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Output/
          git commit -m "Auto-extracted assets for Queen Olympias" || echo "No changes to commit"
          git push
