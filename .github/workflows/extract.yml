name: Extract and Convert Assets

on:
  workflow_dispatch: 

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Legacy Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1

      - name: Download Blender 2.79b (Legacy)
        run: |
          wget -q https://download.blender.org/release/Blender2.79/blender-2.79b-linux-glibc219-x86_64.tar.bz2
          tar -xf blender-2.79b-linux-glibc219-x86_64.tar.bz2
          mv blender-2.79b-linux-glibc219-x86_64 blender_legacy

      - name: Run Export Script (Blender 2.79b)
        run: |
          for file in Models/*.blend; do
            if [ -f "$file" ]; then
              echo "Processing $file..."
              ./blender_legacy/blender -b "$file" -P Workflows/upgrade.py
            fi
          done

      - name: Clean up Blender binaries
        run: |
          rm -rf blender_legacy
          rm -f blender-*.tar.bz2

      - name: Install Modern Blender
        run: |
          sudo apt-get install -y blender python3-numpy

      - name: Convert OBJ to GLB (Blender 4.0)
        run: |
          blender -b -P Workflows/convert_glb.py -- Output/Zuleyka.obj Output/Zuleyka.glb

      - name: Commit and Push Output
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Output/
          git commit -m "Auto-extracted, scaled, textured assets" || echo "No changes to commit"
          git push
