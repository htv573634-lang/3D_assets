name: Extract 3D Assets

on:
  push:
    paths:
      - 'Models/*.blend'
  workflow_dispatch: 

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Git LFS
        run: git lfs install

      - name: Install Blender and Numpy
        run: |
          sudo apt-get update
          # We added python3-numpy here to fix the GLTF exporter crash
          sudo apt-get install -y blender python3-numpy

      - name: Run Extraction Script on All Models
        run: |
          for file in Models/*.blend; do
            if [ -f "$file" ]; then
              echo "Processing $file..."
              blender -b "$file" -P Workflows/extract.py
            fi
          done

      - name: Commit and Push Output
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # We changed this to "git add ." so it catches the modified .blend file and the Output folder
          git add .
          git commit -m "Auto-extracted OBJ and GLB assets" || echo "No changes to commit"
          git push
