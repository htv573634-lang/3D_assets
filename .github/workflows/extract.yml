name: Upgrade and Extract 3D Assets

on:
  workflow_dispatch: 

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Legacy Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1

      - name: Download Blender 2.79b (Legacy)
        run: |
          wget -q https://download.blender.org/release/Blender2.79/blender-2.79b-linux-glibc219-x86_64.tar.bz2
          tar -xf blender-2.79b-linux-glibc219-x86_64.tar.bz2
          mv blender-2.79b-linux-glibc219-x86_64 blender_legacy

      - name: Run Upgrade Script (Blender 2.79)
        run: |
          for file in Models/*.blend; do
            if [ -f "$file" ]; then
              echo "Upgrading $file..."
              ./blender_legacy/blender -b "$file" -P Workflows/upgrade.py
            fi
          done

      - name: Install Modern Blender and Numpy
        run: |
          sudo apt-get install -y blender python3-numpy

      - name: Run Extraction Script (Blender 4.0)
        run: |
          for file in Output/*_clean.blend; do
            if [ -f "$file" ]; then
              echo "Extracting from $file..."
              blender -b "$file" -P Workflows/extract.py
            fi
          done

      - name: Clean up temporary Blender binaries
        run: |
          rm -rf blender_legacy
          rm -f blender-*.tar.bz2

      - name: Commit and Push Output
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # Explicitly add only the folders we want to track
          git add Output/ Models/ .github/ Workflows/ .gitignore .gitattributes
          git commit -m "Auto-upgraded and extracted OBJ and GLB assets" || echo "No changes to commit"
          git push
